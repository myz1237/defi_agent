# Local-dev Postgres (trust auth, bound to 127.0.0.1 only). For production, set a password and restrict networking.
services:
  postgres:
    image: paradedb/paradedb:latest  # Postgres + pgvector + pg_search (BM25) for hybrid search
    container_name: defi-agent-pg
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust   # passwordless for local dev; never use in production
      POSTGRES_USER: postgres
      POSTGRES_DB: defi_agent
    ports:
      - "127.0.0.1:5432:5432"            # bind to localhost only (avoid exposure under trust auth)
    volumes:
      - pgdata:/var/lib/postgresql  # named volume (PG18+ layout: data lives in a version subdir here)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d defi_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
