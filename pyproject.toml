[project]
name = "defi-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "langchain-anthropic>=1.4.6",
    "langgraph>=1.2.5",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "sse-starlette>=3.3.4",
    "uvicorn[standard]>=0.49.0",
    "web3>=7.16.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.30",
    "langsmith[claude-agent-sdk]>=0.8.16",
    "ruff>=0.15.17",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes:未用变量/import、未定义名等
    "I",   # isort:import 排序(配合保存时自动整理 import)
    "UP",  # pyupgrade:用更新的 Python 语法
    "B",   # flake8-bugbear:常见易错写法
    "SIM", # flake8-simplify:可简化的写法
    "C4",  # flake8-comprehensions:更好的推导式
]
ignore = [
    # "E501",  # line-too-long:换行交给 formatter 处理,不再报警
    "B008",  # FastAPI 依赖注入惯用法:Depends() 作默认值
]
