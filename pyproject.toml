[project]
name = "defi-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.137.2",
    "greenlet>=3.5.2",
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "langchain-anthropic>=1.4.6",
    "langgraph>=1.2.5",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.3.4",
    "uvicorn[standard]>=0.49.0",
    "web3>=7.16.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.30",
    "langsmith[claude-agent-sdk]>=0.8.16",
    "pytest>=9.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.17",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["migrations"]  # alembic-generated boilerplate

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused vars/imports, undefined names, etc.
    "I",   # isort: import ordering
    "UP",  # pyupgrade: modern Python syntax
    "B",   # flake8-bugbear: common pitfalls
    "SIM", # flake8-simplify: simplifiable code
    "C4",  # flake8-comprehensions: better comprehensions
]
ignore = [
    # "E501",  # line-too-long: left to the formatter
    "B008",  # FastAPI idiom: Depends() as a default value
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
